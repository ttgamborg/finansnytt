name: Oppdater indekstall

on:
  schedule:
    # Kjører hvert 15. minutt i børsenes faktiske åpningstid, man–fre:
    #   Oslo Børs        09:00–16:20
    #   Nasdaq Stockholm  09:00–17:30
    #   Nasdaq Copenhagen 09:00–17:00
    #   Nasdaq Helsinki   09:00–17:30
    # Alle fire åpner kl. 09:00 norsk tid, og Stockholm/Helsinki stenger sist kl.
    # 17:30 — derfor kjører vi fra 09:00 til ca. 17:52 (litt buffer for at siste
    # sluttkurs skal rekke å bli synlig hos kildene våre).
    #
    # NB: cron går alltid i UTC, derfor 7–15 her (norsk tid er UTC+2 om sommeren/
    # UTC+1 om vinteren — juster med 1 time når vinter-/sommertid skifter, samme
    # helg for alle de fire landene).
    #
    # Minuttene er bevisst forskjøvet til 7/22/37/52 i stedet for 0/15/30/45.
    # GitHub kjører veldig mange jobber nøyaktig på de "runde" minuttallene
    # (0/15/30/45), og under pågang dropper de rett og slett planlagte kjøringer
    # helt uten varsel i stedet for å bare forsinke dem. Å legge tidspunktet
    # midt mellom disse gjør at jobben treffer et roligere tidspunkt i køen.
    - cron: "7,22,37,52 7-15 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: oppdater-tall
  cancel-in-progress: false

jobs:
  oppdater:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sjekk ut repo
        uses: actions/checkout@v7

      - name: Sett opp Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Installer avhengigheter
        run: npm install

      - name: Installer Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Hent ferske indekstall
        run: node scripts/hent-tall.mjs

      - name: Commit og push data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "Ingen endringer i data.json — hopper over commit."
          else
            git commit -m "Oppdater indekstall $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi
